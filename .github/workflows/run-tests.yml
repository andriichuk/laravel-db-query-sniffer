name: run-tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, php: '8.3', laravel: '11.*', testbench: '9.*', pest: '3.*'}
          - {os: ubuntu-latest, php: '8.4', laravel: '11.*', testbench: '9.*', pest: '3.*'}
          - {os: ubuntu-latest, php: '8.3', laravel: '12.*', testbench: '10.*', pest: '4.*'}
          - {os: ubuntu-latest, php: '8.4', laravel: '12.*', testbench: '10.*', pest: '4.*'}
          - {os: ubuntu-latest, php: '8.5', laravel: '12.*', testbench: '10.*', pest: '4.*'}
          - {os: ubuntu-latest, php: '8.3', laravel: '13.*', testbench: '11.*', pest: '4.*'}
          - {os: ubuntu-latest, php: '8.4', laravel: '13.*', testbench: '11.*', pest: '4.*'}
          - {os: ubuntu-latest, php: '8.5', laravel: '13.*', testbench: '11.*', pest: '4.*'}
          - {os: windows-latest, php: '8.4', laravel: '13.*', testbench: '11.*', pest: '4.*'}

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
      - name: Select compatible framework and test dependencies
        run: >-
          composer require --dev --no-update --no-interaction
          "laravel/framework:${{ matrix.laravel }}"
          "orchestra/testbench:${{ matrix.testbench }}"
          "pestphp/pest:${{ matrix.pest }}"
          "pestphp/pest-plugin-laravel:${{ matrix.pest }}"
          "pestphp/pest-plugin-arch:${{ matrix.pest }}"
      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Validate package metadata
        run: composer validate --strict
      - name: Run tests
        run: composer test -- --ci

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - name: Enforce source coverage
        run: composer test-coverage -- --min=95
